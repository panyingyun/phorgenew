services:
  ph-web:
    image: harbor.michaelapp.com/library/phorge-zh:v2026
    restart: always
    ports:
      - "8022:8022"
      - "80:80"
    depends_on:
      - ph-database
    env_file: .env
    volumes: 
      - ph-repo:/var/repo
      - ph-files:/storage
  ph-database:
    image: mariadb:10.11
    restart: always
    volumes:
      - database-volume:/var/lib/mysql
    env_file: .env
    configs:
      - source: my_conf
        target: /etc/mysql/conf.d/my_conf.cnf
        mode: 0644
      - source: init_db
        target: /docker-entrypoint-initdb.d/phorge_init_db.sh
        mode: 0644
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
  ph-storage:
    image: rustfs/rustfs:latest
    restart: always
    ports: 
      - "9000:9000"   # S3 API
      - "9001:9001"   # RustFS Console
    volumes: 
      - rustfs-data:/data
    env_file: .env
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${PHORGE_STORAGE_S3_SERVER_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${PHORGE_STORAGE_S3_SERVER_SECRET_KEY}
      # Local single-disk testing only; keep this strict in production.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      start_period: 10s
      interval: 15s
      timeout: 5s
      retries: 3

configs:
  my_conf:
    content: |
      [mysqld]
      disable-skip-name-resolve=1
      max_allowed_packet=32M
      sql_mode=STRICT_ALL_TABLES
      local_infile=0
      innodb_buffer_pool_size=1600M

  init_db:
    content: |
      mysql_note "Creating web database and user"
      docker_process_sql <<"EOF"
          CREATE DATABASE IF NOT EXISTS ${PHORGE_MYSQL_DATABASE} CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE USER IF NOT EXISTS '${PHORGE_MYSQL_USER}'@'%' IDENTIFIED BY '${PHORGE_MYSQL_PASS}';
          GRANT ALL PRIVILEGES ON `phabricator\_%`.* TO '${PHORGE_MYSQL_USER}'@'%';
          FLUSH PRIVILEGES;
      EOF

volumes:
  database-volume:
  rustfs-data:
  ph-repo:
  ph-files:
